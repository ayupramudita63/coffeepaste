name: coffee_paste
description: "Aplikasi Point of Sale untuk Coffee Paste"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  nested: ^1.0.0

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # Login Google (ID token dikirim ke backend)
  google_sign_in: ^7.2.0

  # Push notification (FCM) dan tampilannya saat app terbuka
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # Penyimpanan aman (token login)
  flutter_secure_storage: ^9.2.4

  # UI & Utils
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2

  # Pembayaran QRIS & struk: tampil QR, simpan gambar ke galeri
  qr_flutter: ^4.1.0
  gal: ^2.3.0
  path_provider: ^2.1.4

  # Icons
  hugeicons: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Poppins disertakan agar tidak diunduh dari internet saat app dibuka.
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
